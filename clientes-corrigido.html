<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Clientes • Akatsuky</title><style>body{margin:0;background:#08090c;color:#f7f7fa;font-family:Arial,sans-serif}.top{height:78px;border-bottom:1px solid #2a2e37;background:#0c0d11;display:flex;align-items:center;justify-content:space-between;padding:0 28px}.top h1{margin:0;font-size:22px}.top p{margin:4px 0 0;color:#9da3b0;font-size:13px}.btn{background:#171a21;color:#fff;border:1px solid #343844;border-radius:10px;padding:11px 14px;cursor:pointer}.wrap{max-width:1450px;margin:auto;padding:25px}.notice{padding:13px 16px;border:1px solid #1c7351;border-radius:12px;background:#0d1814;color:#87efbd;margin-bottom:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:20px}.card{background:#11141a;border:1px solid #2a2e37;border-radius:15px;padding:18px}.card span{color:#9da3b0;font-size:12px}.card b{display:block;font-size:25px;margin-top:7px}.search{width:100%;box-sizing:border-box;padding:13px;background:#090b0f;color:#fff;border:1px solid #343844;border-radius:10px;margin:6px 0 12px}.tableWrap{overflow:auto;background:#11141a;border:1px solid #2a2e37;border-radius:15px}table{width:100%;border-collapse:collapse;min-width:850px}th,td{text-align:left;padding:14px;border-bottom:1px solid #272b34}th{color:#aeb3bf;font-size:12px}.rank{font-size:18px;font-weight:bold;color:#ff4056}.name{font-weight:bold}.money{color:#5ce2a2;font-weight:bold}.detail{background:#191c24;color:#fff;border:1px solid #343844;border-radius:8px;padding:7px 10px;cursor:pointer}.empty{text-align:center;padding:35px;color:#9da3b0}.hidden{display:none!important}.modal{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999}.modal.hidden{display:none!important}.modalBox{max-width:700px;width:100%;max-height:85vh;overflow:auto;background:#11141a;border:1px solid #2a2e37;border-radius:16px;padding:20px;box-sizing:border-box}.close{float:right}.order{padding:12px;border:1px solid #2a2e37;border-radius:10px;margin:8px 0}.foot{text-align:center;color:#656b77;font-size:11px;margin:28px 0}@media(max-width:800px){.cards{grid-template-columns:1fr}.wrap{padding:15px}.top{padding:0 15px}}</style></head><body><header class="top"><div><h1>👥 CLIENTES</h1><p>Ranking dos clientes que mais pedem</p></div><button class="btn" onclick="location.href='painel.html'">← Voltar aos pedidos</button></header><main class="wrap"><div id="notice" class="notice">Carregando Firebase...</div><section id="app" class="hidden"><div class="cards"><div class="card"><span>👥 CLIENTES</span><b id="count">0</b></div><div class="card"><span>🏆 MAIS PEDIDOS</span><b id="top">—</b></div><div class="card"><span>💰 FATURAMENTO</span><b id="total">R$ 0,00</b></div></div><input id="search" class="search" placeholder="🔎 Buscar por nome ou telefone..."><div class="tableWrap"><table><thead><tr><th>#</th><th>CLIENTE</th><th>TELEFONE</th><th>PEDIDOS</th><th>TOTAL GASTO</th><th>ÚLTIMO PEDIDO</th><th></th></tr></thead><tbody id="rows"></tbody></table></div><div class="foot">Desenvolvido por Marcio Vasconcelos • Suporte: (19) 9 9504-4272 • marcio_vasconcelos@hotmail.com.br</div></section></main><div id="modal" class="modal hidden" aria-hidden="true"><div class="modalBox"><button id="closeBtn" class="btn close">✕</button><h2 id="modalTitle">Cliente</h2><div id="modalInfo"></div><h3>📦 Pedidos</h3><div id="modalOrders"></div></div></div><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js?v=9"></script><script>const $=id=>document.getElementById(id);let db,allOrders=[];const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function key(c){const p=String(c.phone||'').replace(/\D/g,'');return p||String(c.name||'cliente').trim().toLowerCase()}function render(){const map={};allOrders.forEach(([id,o])=>{const c=o.customer||{},k=key(c);if(!map[k])map[k]={key:k,name:c.name||'Cliente',phone:c.phone||'—',address:c.street?`${c.street} ${c.number||''}, ${c.neighborhood||''}`:'',orders:[],total:0,last:0};map[k].orders.push({id,o});map[k].total+=Number(o.total||0);map[k].last=Math.max(map[k].last,Number(o.createdAt||0))});let clients=Object.values(map).sort((a,b)=>b.orders.length-a.orders.length||b.total-a.total);$('count').textContent=clients.length;$('top').textContent=clients[0]?.name||'—';$('total').textContent=money(clients.reduce((s,c)=>s+c.total,0));const q=$('search').value.trim().toLowerCase();clients=clients.filter(c=>`${c.name} ${c.phone}`.toLowerCase().includes(q));$('rows').innerHTML=clients.length?clients.map((c,i)=>`<tr><td class="rank">${i+1}</td><td class="name">${esc(c.name)}</td><td>${esc(c.phone)}</td><td>${c.orders.length}</td><td class="money">${money(c.total)}</td><td>${c.last?new Date(c.last).toLocaleString('pt-BR'):'—'}</td><td><button class="detail" data-key="${esc(c.key)}">VER PEDIDOS</button></td></tr>`).join(''):'<tr><td colspan="7" class="empty">Nenhum cliente encontrado.</td></tr>';window.clients=map}function openClient(k){const c=window.clients[k];if(!c)return;$('modalTitle').textContent='👤 '+c.name;$('modalInfo').innerHTML=`<p>📞 <b>${esc(c.phone)}</b></p><p>📍 ${esc(c.address||'Endereço não informado')}</p><p>🛒 <b>${c.orders.length}</b> pedidos • 💰 <b>${money(c.total)}</b></p>`;$('modalOrders').innerHTML=c.orders.sort((a,b)=>Number(b.o.createdAt||0)-Number(a.o.createdAt||0)).map(({id,o})=>`<div class="order"><b>#${esc(id.slice(-6))}</b> — ${money(o.total)}<br><small>${o.createdAt?new Date(Number(o.createdAt)).toLocaleString('pt-BR'):''} • ${esc(o.status||'aguardando')}</small></div>`).join('');$('modal').classList.remove('hidden');$('modal').setAttribute('aria-hidden','false')}function closeModal(){$('modal').classList.add('hidden');$('modal').setAttribute('aria-hidden','true')}$('closeBtn').addEventListener('click',closeModal);$('modal').addEventListener('click',e=>{if(e.target===$('modal'))closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('search').oninput=render;$('rows').onclick=e=>{const b=e.target.closest('[data-key]');if(b)openClient(b.dataset.key)};try{if(!window.AKATSUKY_FIREBASE_CONFIG)throw new Error('Configuração Firebase não carregada');if(!firebase.apps.length)firebase.initializeApp(window.AKATSUKY_FIREBASE_CONFIG);db=firebase.database();firebase.auth().onAuthStateChanged(u=>{if(!u){$('notice').textContent='🔐 Faça login no ADM e depois abra Clientes novamente.';return}$('app').classList.remove('hidden');$('notice').textContent='🟢 Firebase conectado';db.ref('orders').on('value',s=>{allOrders=Object.entries(s.val()||{});render()})})}catch(e){console.error(e);$('notice').textContent='❌ Erro Firebase: '+(e.message||e)}</script></body></html>
