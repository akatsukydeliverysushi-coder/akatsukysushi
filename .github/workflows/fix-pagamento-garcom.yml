name: Corrigir sincronizacao de pagamento do Garcom
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar correcao
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          g = Path('garcom.html')
          s = g.read_text(encoding='utf-8')
          old = '<option value="dinheiro">💵 Dinheiro</option><option value="cartao">💳 Cartão</option>'
          new = '<option value="dinheiro">💵 Dinheiro</option><option value="cartao">💳 Cartão</option><option value="pix">🔑 PIX</option>'
          if old in s and new not in s:
              s = s.replace(old, new, 1)
          old = "${p.forma==='dinheiro'?'💵 Dinheiro':'💳 Cartão'}: <b>${brl(p.valor)}</b>"
          new = "${p.forma==='dinheiro'?'💵 Dinheiro':p.forma==='pix'?'🔑 PIX':'💳 Cartão'}: <b>${brl(p.valor)}</b>"
          if old in s:
              s = s.replace(old, new, 1)
          old = "await update(ref(db),u);$('modal').style.display='none';pagamentos=[];cart=[];mesa=null;"
          new = "const formas=[...new Set(pagamentos.map(p=>p.forma))];const formaConta=formas.length===1?formas[0]:'misto';ps.forEach(p=>{u[`orders/${p.id}/customer/payment`]=formaConta;u[`orders/${p.id}/formaPagamento`]=formaConta;});await update(ref(db),u);$('modal').style.display='none';pagamentos=[];cart=[];mesa=null;"
          if old in s:
              s = s.replace(old, new, 1)
          g.write_text(s, encoding='utf-8')

          p = Path('painel.js')
          s = p.read_text(encoding='utf-8')
          old = "function payment(v){v=String(v||'').toLowerCase();if(v.includes('pix'))return 'PIX';if(v.includes('crédito')||v.includes('credito')||v.includes('cartão')||v.includes('cartao'))return 'Cartão';if(v.includes('débito')||v.includes('debito'))return 'Débito';return 'Dinheiro'}"
          new = "function payment(v){v=String(v||'').toLowerCase();if(v.includes('pix'))return 'PIX';if(v.includes('misto'))return 'Misto';if(v.includes('crédito')||v.includes('credito')||v.includes('cartão')||v.includes('cartao'))return 'Cartão';if(v.includes('débito')||v.includes('debito'))return 'Débito';return 'Dinheiro'}\nfunction orderPayment(o){const c=o?.customer||{};if(c.payment)return payment(c.payment);const ps=Array.isArray(o?.pagamentos)?o.pagamentos:[];if(ps.length===1)return payment(ps[0]?.forma);if(ps.length>1)return 'Misto';return 'Dinheiro'}"
          if old in s:
              s = s.replace(old, new, 1)
          s = s.replace("if(c.payment)return orderPayment(o);", "if(c.payment)return payment(c.payment);")
          s = s.replace("payment(o.customer?.payment)", "orderPayment(o)")
          s = s.replace("payment(c.payment)", "orderPayment(o)")
          s = s.replace("if(c.payment)return orderPayment(o);", "if(c.payment)return payment(c.payment);")
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar alteracoes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add garcom.html painel.js
          if git diff --cached --quiet; then echo "Nenhuma alteracao necessaria"; exit 0; fi
          git commit -m "Corrigir sincronizacao de pagamento do Garcom"
          git push
