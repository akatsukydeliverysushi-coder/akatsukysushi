<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Akatsuky Garçom</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202020;font-family:Arial,sans-serif}.top{background:#111;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:3}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}.mesas,.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.btn:active{transform:scale(.98)}.mesa{padding:18px 8px}.selecionada{outline:3px solid #e51b34}.produto{border:1px solid #ddd;padding:12px;border-radius:12px;background:#fff}.produto button{margin-top:8px}.produto img{width:100%;height:120px;object-fit:cover;border-radius:9px}.old{color:#888;text-decoration:line-through;font-size:13px;margin:8px 0 2px}.promo{color:#c5162e;font-size:20px;font-weight:900;margin:2px 0}.normal{font-size:18px;font-weight:900;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#777}.total{font-size:21px;font-weight:900}.ok{display:none;padding:13px;background:#e7f7eb;color:#176b30;border-radius:10px;font-weight:700}.erro{display:none;padding:13px;background:#ffe7e7;color:#8d1717;border-radius:10px}.conta-item{padding:7px 0;border-bottom:1px solid #eee}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #ccc;border-radius:9px}.cat{padding:9px 12px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}.cat.on{background:#111;color:#fff}.badge{display:inline-block;background:#c5162e;color:#fff;padding:4px 7px;border-radius:8px;font-size:11px;font-weight:800}.mesa-controles{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:12px;flex-wrap:wrap}.mesa-controles .btn{width:auto;min-width:150px}.mesa-qtd{font-size:18px;font-weight:900;text-align:center;flex:1;min-width:150px}.mesa-acoes{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}.mesa-acoes .btn{flex:1;min-width:180px}.finalizar{background:#176b30}.adicionar-pedido{background:#c5162e}.historico{background:#555}.rodape{text-align:center;color:#777;font-size:12px;padding:25px 10px}
</style>
</head>
<body>
<header class="top"><h2>🍣 AKATSUKY GARÇOM</h2><div id="mesaTitulo">Selecione uma mesa</div></header>
<main class="wrap">
<div id="erro" class="erro"></div>
<section class="card"><h3>🍽️ Mesas</h3><div class="mesa-controles"><button id="diminuirMesa" class="btn">➖ DIMINUIR MESA</button><div id="mesaQtd" class="mesa-qtd"></div><button id="aumentarMesa" class="btn">➕ ADICIONAR MESA</button></div><div id="mesas" class="mesas"></div></section>
<section class="card"><h3>💰 Conta atual da mesa</h3><div id="conta"><span class="muted">Selecione uma mesa.</span></div><div id="mesaAcoes" class="mesa-acoes" style="display:none"><button id="novoPedidoMesa" class="btn adicionar-pedido">➕ ADICIONAR PEDIDO</button><button id="finalizarConta" class="btn finalizar">💳 FINALIZAR CONTA</button><button id="historicoMesa" class="btn historico">🧾 VER HISTÓRICO</button></div></section>
<section class="card"><h3>🍣 Cardápio do ADM</h3><div class="toolbar"><input id="busca" placeholder="🔎 Buscar produto..."><button id="limpar" class="btn" style="width:auto">Limpar</button></div><div id="categorias" class="toolbar" style="margin:12px 0"></div><div id="produtos" class="produtos"></div></section>
<section class="card"><h3>🛒 Novo pedido</h3><div id="carrinho"></div><hr><div class="row"><span class="total">Total do novo pedido</span><span id="total" class="total">R$ 0,00</span></div><br><button id="enviar" class="btn">✅ ENVIAR PEDIDO</button><div id="ok" class="ok">Pedido enviado para o restaurante.</div></section>
</main>
<footer class="rodape">Desenvolvido por Marcio Vasconcelos<br>Suporte: (19) 9 95044-272 • marcio_vasconcelos@hotmail.com.br</footer>
<script src="./firebase-config.js"></script>
<script type="module">
import {initializeApp} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';
import {getDatabase,ref,push,onValue,serverTimestamp,update} from 'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';
const erroEl=document.getElementById('erro');function erro(msg){erroEl.textContent=msg;erroEl.style.display='block'}
const config=window.AKATSUKY_FIREBASE_CONFIG;if(!config){erro('❌ Configuração do Firebase não carregou.');throw new Error('AKATSUKY_FIREBASE_CONFIG ausente')}
const db=getDatabase(initializeApp(config));let mesa=null,cart=[],pedidos={},produtos=[],categoria='Todos',busca='';
const MIN_MESAS=1,MAX_MESAS=100;let quantidadeMesas=Math.min(MAX_MESAS,Math.max(MIN_MESAS,Number(localStorage.getItem('akatsuky_quantidade_mesas')||5)));
const listaMesas=()=>Array.from({length:quantidadeMesas},(_,i)=>String(i+1).padStart(2,'0'));const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function preco(p){const promo=Number(p.promoPrice??p.promotionPrice??p.promo_price??p.precoPromocional??p.precoPromocao??0),normal=Number(p.price??p.preco??0);return promo>0&&promo<normal?promo:normal}
function normaliza(v,i){v=v||{};return{...v,id:String(v.id??v.codigo??i+1),name:String(v.name??v.nome??v.title??'Produto'),cat:String(v.cat??v.categoria??v.category??'Outros'),desc:String(v.desc??v.descricao??v.description??''),price:Number(v.price??v.preco??0),promoPrice:Number(v.promoPrice??v.promotionPrice??v.promo_price??v.precoPromocional??v.precoPromocao??0),image:v.image??v.imageUrl??v.imagem??''}}
function normalizaLista(v){if(!v)return[];if(Array.isArray(v))return v.map(normaliza);if(Array.isArray(v.items))return v.items.map(normaliza);if(v.items&&typeof v.items==='object')return Object.values(v.items).map(normaliza);if(typeof v==='object')return Object.values(v).filter(x=>x&&typeof x==='object').map(normaliza);return[]}
function renderMesas(){document.getElementById('mesaQtd').textContent=`${quantidadeMesas} ${quantidadeMesas===1?'mesa':'mesas'} disponíveis`;document.getElementById('mesas').innerHTML=listaMesas().map(m=>`<button class="btn mesa ${mesa===m?'selecionada':''}" data-mesa="${m}">🍽️ Mesa ${m}</button>`).join('')}
function salvarQuantidadeMesas(){localStorage.setItem('akatsuky_quantidade_mesas',String(quantidadeMesas));renderMesas()}
function adicionarMesa(){if(quantidadeMesas>=MAX_MESAS)return alert(`O limite é de ${MAX_MESAS} mesas.`);quantidadeMesas++;salvarQuantidadeMesas()}
function diminuirMesa(){if(quantidadeMesas<=MIN_MESAS)return alert('É necessário manter pelo menos 1 mesa.');const removida=String(quantidadeMesas).padStart(2,'0');const aberta=Object.values(pedidos).some(p=>p&&String(p.mesa).padStart(2,'0')===removida&&p.status!=='entregue'&&p.status!=='finalizado');if(aberta)return alert(`A Mesa ${removida} possui pedido aberto e não pode ser removida.`);if(mesa===removida){mesa=null;cart=[];document.getElementById('mesaTitulo').textContent='Selecione uma mesa';renderCarrinho();renderConta()}quantidadeMesas--;salvarQuantidadeMesas()}
function pedidosMesa(abertos=true){if(!mesa)return[];return Object.entries(pedidos).filter(([_,p])=>p&&String(p.mesa).padStart(2,'0')===mesa&&(!abertos||p.status!=='finalizado')).map(([id,p])=>({id,...p}))}
function renderCategorias(){const cats=['Todos',...new Set(produtos.map(p=>p.cat).filter(Boolean))];document.getElementById('categorias').innerHTML=cats.map(c=>`<button class="cat ${categoria===c?'on':''}" data-cat="${esc(c)}">${esc(c)}</button>`).join('')}
function renderProdutos(){const q=busca.trim().toLowerCase();const list=produtos.filter(p=>(categoria==='Todos'||p.cat===categoria)&&(!q||`${p.name} ${p.desc} ${p.cat}`.toLowerCase().includes(q)));document.getElementById('produtos').innerHTML=list.length?list.map(p=>{const valor=preco(p),old=Number(p.price||0),promo=valor<old;return `<div class="produto">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}">`:''}<div class="muted">${esc(p.cat)}</div><h3>${esc(p.name)}</h3>${p.desc?`<div class="muted">${esc(p.desc)}</div>`:''}${promo?`<span class="badge">🔥 PROMOÇÃO</span><div class="old">${brl(old)}</div><div class="promo">${brl(valor)}</div>`:`<div class="normal">${brl(valor)}</div>`}<button class="btn add" data-id="${esc(p.id)}">Adicionar</button></div>`}).join(''):'<div class="muted">Nenhum produto encontrado.</div>'}
function renderConta(){const acoes=document.getElementById('mesaAcoes');if(!mesa){document.getElementById('conta').innerHTML='<span class="muted">Selecione uma mesa.</span>';acoes.style.display='none';return}const ps=pedidosMesa(true);const abertos=ps.filter(p=>p.status!=='entregue'&&p.status!=='finalizado');const total=abertos.reduce((s,p)=>s+(Number(p.total)||0),0);document.getElementById('conta').innerHTML=abertos.length?abertos.map(p=>`<div class="conta-item"><b>${p.status==='aguardando'?'🔴':p.status==='recebido'?'🟢':'🟡'} ${esc(p.status||'')}</b><br>${(p.itens||[]).map(x=>`${Number(x.qtd)||0}x ${esc(x.nome)} — ${brl(Number(x.preco||0)*Number(x.qtd||0))}`).join('<br>')}<br><b>${brl(p.total)}</b></div>`).join('<hr>')+`<hr><div class="total">Conta atual: ${brl(total)}</div>`:'<span class="muted">Mesa livre. Nenhum pedido aberto.</span>';acoes.style.display='flex'}
function renderCarrinho(){document.getElementById('carrinho').innerHTML=cart.length?cart.map((p,i)=>`<div class="row"><span>${p.qtd}x ${esc(p.nome)}</span><span>${brl(p.preco*p.qtd)} <button class="rem" data-index="${i}">−</button></span></div>`).join('<hr>'):'<span class="muted">Nenhum item.</span>';document.getElementById('total').textContent=brl(cart.reduce((s,p)=>s+p.preco*p.qtd,0))}
function render(){renderMesas();renderCategorias();renderProdutos();renderCarrinho();renderConta()}
document.getElementById('aumentarMesa').addEventListener('click',adicionarMesa);document.getElementById('diminuirMesa').addEventListener('click',diminuirMesa);
document.getElementById('mesas').addEventListener('click',e=>{const b=e.target.closest('[data-mesa]');if(!b)return;mesa=b.dataset.mesa;document.getElementById('mesaTitulo').textContent='Mesa '+mesa;cart=[];render()});
document.getElementById('categorias').addEventListener('click',e=>{const b=e.target.closest('[data-cat]');if(!b)return;categoria=b.dataset.cat;renderCategorias();renderProdutos()});
document.getElementById('produtos').addEventListener('click',e=>{const b=e.target.closest('.add');if(!b)return;if(!mesa)return alert('Selecione uma mesa primeiro.');const p=produtos.find(x=>String(x.id)===String(b.dataset.id));if(!p)return;const valor=preco(p),x=cart.find(v=>String(v.id)===String(p.id));x?x.qtd++:cart.push({id:p.id,nome:p.name,preco:valor,qtd:1});renderCarrinho()});
document.getElementById('carrinho').addEventListener('click',e=>{const b=e.target.closest('.rem');if(!b)return;const i=Number(b.dataset.index);if(!cart[i])return;cart[i].qtd--;if(cart[i].qtd<=0)cart.splice(i,1);renderCarrinho()});
document.getElementById('busca').addEventListener('input',e=>{busca=e.target.value;renderProdutos()});document.getElementById('limpar').addEventListener('click',()=>{busca='';document.getElementById('busca').value='';renderProdutos()});
document.getElementById('novoPedidoMesa').addEventListener('click',()=>{if(!mesa)return alert('Selecione uma mesa.');document.getElementById('produtos').scrollIntoView({behavior:'smooth'});document.getElementById('mesaTitulo').textContent=`Mesa ${mesa} • Adicionando pedido`});
document.getElementById('finalizarConta').addEventListener('click',async()=>{if(!mesa)return;const ps=pedidosMesa(true).filter(p=>p.status!=='finalizado'&&p.status!=='entregue');if(!ps.length)return alert('Esta mesa não possui pedidos abertos.');if(!confirm(`Finalizar a conta da Mesa ${mesa}?\nTotal: ${brl(ps.reduce((s,p)=>s+(Number(p.total)||0),0))}`))return;try{const updates={};ps.forEach(p=>updates[`pedidosMesa/${p.id}/status`]='finalizado');await update(ref(db),updates);alert(`Conta da Mesa ${mesa} finalizada com sucesso.`);cart=[];renderCarrinho();renderConta()}catch(e){console.error(e);erro('❌ Não foi possível finalizar a conta.')}});
document.getElementById('historicoMesa').addEventListener('click',()=>{if(!mesa)return;const ps=pedidosMesa(false);if(!ps.length)return alert('Nenhum pedido registrado para esta mesa.');alert(ps.map(p=>`${p.status==='finalizado'?'✅':'🔵'} ${brl(p.total)} — ${new Date(p.criadoEm||Date.now()).toLocaleString('pt-BR')}`).join('\n'))});
document.getElementById('enviar').addEventListener('click',async()=>{if(!mesa)return alert('Selecione uma mesa.');if(!cart.length)return alert('Adicione itens ao pedido.');const total=cart.reduce((s,p)=>s+p.preco*p.qtd,0);erroEl.style.display='none';try{await push(ref(db,'pedidosMesa'),{mesa,origem:'garcom',status:'aguardando',itens:cart,total,criadoEm:serverTimestamp()});document.getElementById('ok').style.display='block';cart=[];renderCarrinho();renderConta();setTimeout(()=>document.getElementById('ok').style.display='none',3500)}catch(e){erro('❌ Não foi possível enviar o pedido.');console.error(e)}});
onValue(ref(db,'settings/menu'),s=>{try{produtos=normalizaLista(s.val());render()}catch(e){console.error(e);erro('❌ Erro ao carregar o cardápio do ADM.')}});onValue(ref(db,'pedidosMesa'),s=>{pedidos=s.val()||{};renderMesas();renderConta()});render();
</script>
</body>
</html>
