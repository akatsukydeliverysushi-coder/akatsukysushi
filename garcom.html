<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akatsuky Garçom</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202020;font-family:Arial,sans-serif}.top{background:#111;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:3}.wrap{max-width:900px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}.mesas,.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(125px,1fr));gap:10px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.mesa{padding:18px 8px}.selecionada{outline:3px solid #e51b34}.produto{border:1px solid #ddd;padding:12px;border-radius:12px}.produto button{margin-top:8px}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#777}.total{font-size:21px;font-weight:900}.ok{display:none;padding:13px;background:#e7f7eb;color:#176b30;border-radius:10px;font-weight:700}.erro{display:none;padding:13px;background:#ffe7e7;color:#8d1717;border-radius:10px}</style></head><body><header class="top"><h2>🍣 AKATSUKY GARÇOM</h2><div id="mesaTitulo">Selecione uma mesa</div></header><main class="wrap"><div id="erro" class="erro"></div><section class="card"><h3>🍽️ Escolha a mesa</h3><div id="mesas" class="mesas"></div></section><section class="card"><h3>🍣 Cardápio</h3><div id="produtos" class="produtos"></div></section><section class="card"><h3>🛒 Pedido da mesa</h3><div id="carrinho"></div><hr><div class="row"><span class="total">Total</span><span id="total" class="total">R$ 0,00</span></div><br><button class="btn" onclick="enviar()">✅ ENVIAR PEDIDO</button><div id="ok" class="ok">Pedido enviado para o restaurante.</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getDatabase,ref,push,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';const db=getDatabase(initializeApp(firebaseConfig));let mesa=null,cart=[];const mesas=Array.from({length:20},(_,i)=>String(i+1).padStart(2,'0'));const produtos=[{nome:'Combo 20 peças',preco:39.90},{nome:'Combo 40 peças',preco:69.90},{nome:'Temaki Salmão',preco:24.90},{nome:'Temaki Filadélfia',preco:25.90},{nome:'Hot Roll',preco:22.90},{nome:'Coca-Cola',preco:6},{nome:'Água',preco:4}];const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function renderMesas(){document.getElementById('mesas').innerHTML=mesas.map(m=>`<button class="btn mesa ${mesa===m?'selecionada':''}" onclick="selecionarMesa('${m}')">🍽️ Mesa ${m}</button>`).join('')}function render(){document.getElementById('produtos').innerHTML=produtos.map((p,i)=>`<div class="produto"><b>${p.nome}</b><p>${brl(p.preco)}</p><button class="btn" onclick="add(${i})">Adicionar</button></div>`).join('');document.getElementById('carrinho').innerHTML=cart.length?cart.map((p,i)=>`<div class="row"><span>${p.qtd}x ${p.nome}</span><span>${brl(p.preco*p.qtd)} <button onclick="rem(${i})">−</button></span></div>`).join('<hr>'):'<span class="muted">Nenhum item.</span>';document.getElementById('total').textContent=brl(cart.reduce((s,p)=>s+p.preco*p.qtd,0))}window.selecionarMesa=m=>{mesa=m;document.getElementById('mesaTitulo').textContent='Mesa '+m;cart=[];renderMesas();render()};window.add=i=>{if(!mesa)return alert('Selecione uma mesa primeiro.');const p=produtos[i],x=cart.find(v=>v.nome===p.nome);x?x.qtd++:cart.push({...p,qtd:1});render()};window.rem=i=>{cart[i].qtd--;if(cart[i].qtd<=0)cart.splice(i,1);render()};window.enviar=async()=>{if(!mesa)return alert('Selecione uma mesa.');if(!cart.length)return alert('Adicione itens ao pedido.');const total=cart.reduce((s,p)=>s+p.preco*p.qtd,0);const box=document.getElementById('erro');box.style.display='none';try{await push(ref(db,'pedidosMesa'),{mesa,origem:'garcom',status:'aguardando',itens:cart,total,criadoEm:serverTimestamp()});document.getElementById('ok').style.display='block';cart=[];render();setTimeout(()=>document.getElementById('ok').style.display='none',3500)}catch(e){box.textContent='❌ Não foi possível enviar. Verifique a conexão com o Firebase.';box.style.display='block';console.error(e)}};renderMesas();render();</script></body></html>
