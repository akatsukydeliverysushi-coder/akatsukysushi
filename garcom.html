<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akatsuky Garçom</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f5f5;color:#202020;font-family:Arial,sans-serif}.top{background:#111;color:#fff;padding:16px;text-align:center;position:sticky;top:0;z-index:3}.wrap{max-width:1000px;margin:auto;padding:14px}.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 9px #0001}.mesas,.produtos{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}.btn{width:100%;padding:12px;border:0;border-radius:10px;background:#111;color:#fff;font-weight:800;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}.mesa{padding:18px 8px}.selecionada{outline:3px solid #e51b34}.produto{border:1px solid #ddd;padding:12px;border-radius:12px;background:#fff}.produto button{margin-top:8px}.produto .old{color:#888;text-decoration:line-through;font-size:13px;margin:8px 0 2px}.produto .promo{color:#c5162e;font-size:20px;font-weight:900;margin:2px 0}.produto .normal{font-size:18px;font-weight:900;margin:8px 0}.row{display:flex;justify-content:space-between;gap:8px;align-items:center}.muted{color:#777}.total{font-size:21px;font-weight:900}.ok{display:none;padding:13px;background:#e7f7eb;color:#176b30;border-radius:10px;font-weight:700}.erro{display:none;padding:13px;background:#ffe7e7;color:#8d1717;border-radius:10px}.conta-item{padding:7px 0;border-bottom:1px solid #eee}.status{font-size:12px;background:#eee;padding:3px 7px;border-radius:8px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.toolbar input{flex:1;min-width:180px;padding:11px;border:1px solid #ccc;border-radius:9px}.cat{padding:9px 12px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}.cat.on{background:#111;color:#fff}.hidden{display:none}.promoBadge{display:inline-block;background:#c5162e;color:#fff;padding:4px 7px;border-radius:8px;font-size:11px;font-weight:800}</style></head><body><header class="top"><h2>🍣 AKATSUKY GARÇOM</h2><div id="mesaTitulo">Selecione uma mesa</div></header><main class="wrap"><div id="erro" class="erro"></div><section class="card"><h3>🍽️ Escolha a mesa</h3><div id="mesas" class="mesas"></div></section><section class="card"><h3>💰 Conta atual da mesa</h3><div id="conta"><span class="muted">Selecione uma mesa.</span></div></section><section class="card"><h3>🍣 Cardápio</h3><div class="toolbar"><input id="busca" placeholder="🔎 Buscar produto..."><button class="btn" style="width:auto" onclick="limparBusca()">Limpar</button></div><div id="categorias" class="toolbar" style="margin:12px 0"></div><div id="produtos" class="produtos"></div></section><section class="card"><h3>🛒 Novo pedido</h3><div id="carrinho"></div><hr><div class="row"><span class="total">Total do novo pedido</span><span id="total" class="total">R$ 0,00</span></div><br><button class="btn" onclick="enviar()">✅ ENVIAR PEDIDO</button><div id="ok" class="ok">Pedido enviado para o restaurante.</div></section></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getDatabase,ref,push,onValue,serverTimestamp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';const app=initializeApp(firebaseConfig);const db=getDatabase(app);let mesa=null,cart=[],pedidos={},produtos=[],categoria='Todos',busca='';const mesas=Array.from({length:20},(_,i)=>String(i+1).padStart(2,'0'));const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function preco(p){const promo=Number(p.promoPrice??p.promotionPrice??p.promo_price??p.precoPromocional??p.precoPromocao??0),normal=Number(p.price??p.preco??0);return promo>0&&promo<normal?promo:normal}function temPromo(p){return preco(p)<Number(p.price??p.preco??0)}function normaliza(v,i){return{...v,id:Number(v.id)||i+1,name:String(v.name??v.nome??'Produto'),cat:String(v.cat??v.categoria??'Outros'),desc:String(v.desc??v.descricao??''),price:Number(v.price??v.preco??0),promoPrice:Number(v.promoPrice??v.promotionPrice??v.promo_price??v.precoPromocional??v.precoPromocao??0),image:v.image??v.imageUrl??''}}function renderMesas(){document.getElementById('mesas').innerHTML=mesas.map(m=>`<button class="btn mesa ${mesa===m?'selecionada':''}" onclick="selecionarMesa('${m}')">🍽️ Mesa ${m}</button>`).join('')}function renderCategorias(){const cats=['Todos',...new Set(produtos.map(p=>p.cat).filter(Boolean))];document.getElementById('categorias').innerHTML=cats.map(c=>`<button class="cat ${categoria===c?'on':''}" onclick="setCategoria('${esc(c)}')">${esc(c)}</button>`).join('')}function renderProdutos(){const q=busca.trim().toLowerCase();const list=produtos.filter(p=>(categoria==='Todos'||p.cat===categoria)&&(!q||`${p.name} ${p.desc} ${p.cat}`.toLowerCase().includes(q)));document.getElementById('produtos').innerHTML=list.length?list.map((p,i)=>{const valor=preco(p),old=Number(p.price||0),promo=temPromo(p);return`<div class="produto">${p.image?`<img src="${esc(p.image)}" alt="${esc(p.name)}" style="width:100%;height:120px;object-fit:cover;border-radius:9px">`:''}<div class="muted">${esc(p.cat)}</div><h3>${esc(p.name)}</h3>${p.desc?`<div class="muted">${esc(p.desc)}</div>`:''}${promo?`<span class="promoBadge">🔥 PROMOÇÃO</span><div class="old">${brl(old)}</div><div class="promo">${brl(valor)}</div>`:`<div class="normal">${brl(valor)}</div>`}<button class="btn" onclick="add(${p.id})">Adicionar</button></div>`}).join(''):'<div class="muted">Nenhum produto encontrado.</div>'}function renderConta(){if(!mesa){document.getElementById('conta').innerHTML='<span class="muted">Selecione uma mesa.</span>';return}const ps=Object.values(pedidos).filter(p=>p&&String(p.mesa).padStart(2,'0')===mesa&&p.status!=='entregue');const total=ps.reduce((s,p)=>s+(Number(p.total)||0),0);document.getElementById('conta').innerHTML=ps.length?ps.map(p=>`<div class="conta-item"><b>${p.status==='aguardando'?'🔴':p.status==='recebido'?'🟢':'🟡'} ${esc(p.status||'')}</b><br>${(p.itens||[]).map(x=>`${Number(x.qtd)||0}x ${esc(x.nome)} — ${brl(Number(x.preco||0)*Number(x.qtd||0))}`).join('<br>')}<br><b>${brl(p.total)}</b></div>`).join('')+`<hr><div class="total">Conta atual: ${brl(total)}</div>`:'<span class="muted">Mesa livre. Nenhum pedido aberto.</span>'}function renderCarrinho(){document.getElementById('carrinho').innerHTML=cart.length?cart.map((p,i)=>`<div class="row"><span>${p.qtd}x ${esc(p.nome)}</span><span>${brl(p.preco*p.qtd)} <button onclick="rem(${i})">−</button></span></div>`).join('<hr>'):'<span class="muted">Nenhum item.</span>';document.getElementById('total').textContent=brl(cart.reduce((s,p)=>s+p.preco*p.qtd,0))}function render(){renderMesas();renderCategorias();renderProdutos();renderCarrinho();renderConta()}window.selecionarMesa=m=>{mesa=m;document.getElementById('mesaTitulo').textContent='Mesa '+m;cart=[];render()};window.setCategoria=c=>{categoria=c;renderCategorias();renderProdutos()};window.limparBusca=()=>{busca='';document.getElementById('busca').value='';renderProdutos()};window.add=id=>{if(!mesa)return alert('Selecione uma mesa primeiro.');const p=produtos.find(x=>Number(x.id)===Number(id));if(!p)return;const valor=preco(p),x=cart.find(v=>Number(v.id)===Number(p.id));x?x.qtd++:cart.push({id:p.id,nome:p.name,preco:valor,qtd:1});renderCarrinho()};window.rem=i=>{if(!cart[i])return;cart[i].qtd--;if(cart[i].qtd<=0)cart.splice(i,1);renderCarrinho()};window.enviar=async()=>{if(!mesa)return alert('Selecione uma mesa.');if(!cart.length)return alert('Adicione itens ao pedido.');const total=cart.reduce((s,p)=>s+p.preco*p.qtd,0),box=document.getElementById('erro');box.style.display='none';try{await push(ref(db,'pedidosMesa'),{mesa,origem:'garcom',status:'aguardando',itens:cart,total,criadoEm:serverTimestamp()});document.getElementById('ok').style.display='block';cart=[];renderCarrinho();setTimeout(()=>document.getElementById('ok').style.display='none',3500)}catch(e){box.textContent='❌ Não foi possível enviar. Verifique a conexão com o Firebase.';box.style.display='block';console.error(e)}};document.getElementById('busca').addEventListener('input',e=>{busca=e.target.value;renderProdutos()});onValue(ref(db,'settings/menu'),s=>{const v=s.val();produtos=v&&Array.isArray(v.items)?v.items.map(normaliza).filter(p=>p.name&&p.price>=0):[];render()});onValue(ref(db,'pedidosMesa'),s=>{pedidos=s.val()||{};renderConta()});render();</script></body></html>
