<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorteios • Akatsuky Delivery Sushi</title><style>body{margin:0;background:#08090c;color:#f7f7fa;font-family:Arial,sans-serif}.wrap{max-width:1000px;margin:auto;padding:30px}.card{background:#11141a;border:1px solid #292e38;border-radius:16px;padding:20px;margin-bottom:16px}input,button{padding:12px;border-radius:9px;border:1px solid #343844;background:#0b0e13;color:#fff}input{width:calc(100% - 26px);margin:6px 0}button{cursor:pointer;font-weight:800}.primary{background:#df1733;border-color:#ff3048}.winner{font-size:28px;text-align:center;padding:30px;color:#5ce2a2}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.muted{color:#969daa}@media(max-width:600px){.row{grid-template-columns:1fr}.wrap{padding:16px}}</style></head><body><main class="wrap"><div class="card"><h1>🎉 SORTEIOS</h1><p class="muted">Crie sorteios entre os clientes que fizeram pedidos.</p><div class="row"><div><label>Nome do sorteio<input id="name" placeholder="Ex.: Sorteio Combo Sushi"></label></div><div><label>Prêmio<input id="prize" placeholder="Ex.: 1 Combo Sushi"></label></div><div><label>Início<input id="start" type="date"></label></div><div><label>Fim<input id="end" type="date"></label></div></div><p id="count">Participantes: 0</p><button id="load" class="primary">👥 CARREGAR PARTICIPANTES</button> <button id="draw" class="primary" disabled>🎲 SORTEAR AGORA</button></div><div id="winner" class="card winner hidden"></div><div class="card"><h2>📜 Histórico</h2><div id="history" class="muted">Nenhum sorteio realizado.</div></div><div class="card muted" style="text-align:center">Desenvolvido por Marcio Vasconcelos<br>Suporte: (19) 9 9504-4272 • marcio_vasconcelos@hotmail.com.br</div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js?v=7"></script><script>let db,participants=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function datesOk(t){const d=new Date(Number(t||0));if(!Number.isFinite(d.getTime()))return false;const a=$('start').value,b=$('end').value,x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return(!a||x>=new Date(a+'T00:00:00'))&&(!b||x<=new Date(b+'T23:59:59'))}function load(){db.ref('orders').once('value').then(s=>{const v=s.val()||{},m=new Map();Object.values(v).forEach(o=>{if(!datesOk(o.createdAt))return;const c=o.customer||{},phone=String(c.phone||'').replace(/\D/g,'');if(!phone)return;if(!m.has(phone))m.set(phone,{name:c.name||'Cliente',phone});});participants=[...m.values()];$('count').textContent='Participantes: '+participants.length;$('draw').disabled=!participants.length}).catch(e=>alert('Erro ao carregar participantes.'))}function draw(){if(!participants.length)return;const p=participants[Math.floor(Math.random()*participants.length)],s={name:$('name').value.trim()||'Sorteio Akatsuky',prize:$('prize').value.trim()||'Prêmio',winner:p,createdAt:firebase.database.ServerValue.TIMESTAMP};db.ref('raffles').push(s).then(()=>{$('winner').classList.remove('hidden');$('winner').innerHTML='🏆 GANHADOR<br><strong>'+esc(p.name)+'</strong><br><small>'+esc(p.phone)+'</small><br><br>🎁 '+esc(s.prize);loadHistory()})}function loadHistory(){db.ref('raffles').limitToLast(20).once('value').then(s=>{const a=Object.values(s.val()||{}).reverse();$('history').innerHTML=a.length?a.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #292e38"><b>${esc(x.name)}</b> — ${esc(x.prize)}<br>🏆 ${esc(x.winner?.name||'')} • ${esc(x.winner?.phone||'')}</div>`).join(''):'Nenhum sorteio realizado.'})}firebase.initializeApp(window.AKATSUKY_FIREBASE_CONFIG);db=firebase.database();firebase.auth().onAuthStateChanged(u=>{if(!u){location.href='painel.html';return}loadHistory()});$('load').onclick=load;$('draw').onclick=draw;</script></body></html>
