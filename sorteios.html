<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sorteios • Akatsuky Delivery Sushi</title><style>body{margin:0;background:#08090c;color:#f7f7fa;font-family:Arial,sans-serif}.wrap{max-width:1050px;margin:auto;padding:28px}.card{background:#11141a;border:1px solid #292e38;border-radius:16px;padding:20px;margin-bottom:16px}input,button{padding:12px;border-radius:9px;border:1px solid #343844;background:#0b0e13;color:#fff;box-sizing:border-box}input{width:100%;margin:6px 0}button{cursor:pointer;font-weight:800}.primary{background:#df1733;border-color:#ff3048}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.winner{font-size:28px;text-align:center;padding:30px;color:#5ce2a2}.muted{color:#969daa}.hidden{display:none}.linkbox{background:#0b0e13;border:1px dashed #555;padding:12px;border-radius:9px;word-break:break-all}.switch{display:flex;gap:8px;align-items:center;margin:10px 0}.switch input{width:auto;margin:0}@media(max-width:650px){.row{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><main class="wrap"><div class="card"><h1>🎉 SORTEIOS</h1><p class="muted">Crie um sorteio e gere um link público para os clientes se inscreverem.</p><div class="row"><label>Nome do sorteio<input id="name" placeholder="Ex.: Sorteio Combo Sushi"></label><label>Prêmio<input id="prize" placeholder="Ex.: 1 Combo Sushi"></label><label>Início<input id="start" type="date"></label><label>Fim<input id="end" type="date"></label></div><label>❓ Pergunta do sorteio<input id="question" placeholder="Ex.: Qual é o seu sushi favorito da Akatsuky?"></label><label>✅ Resposta correta (opcional)<input id="answer" placeholder="Deixe vazio para aceitar qualquer resposta"></label><label class="switch"><input id="requireCorrect" type="checkbox"> Sortear somente participantes com resposta correta</label><div style="margin-top:14px"><button id="create" class="primary">🔗 CRIAR SORTEIO E LINK</button> <button id="load" class="primary">👥 ATUALIZAR PARTICIPANTES</button> <button id="draw" class="primary" disabled>🎲 SORTEAR AGORA</button></div><div id="publicLink" class="hidden" style="margin-top:14px"><b>📱 Link para colocar no Instagram:</b><div id="link" class="linkbox"></div></div><p id="count">Participantes válidos: 0</p></div><div id="winner" class="card winner hidden"></div><div class="card"><h2>📜 Histórico</h2><div id="history" class="muted">Nenhum sorteio realizado.</div></div><div class="card muted" style="text-align:center">Desenvolvido por Marcio Vasconcelos<br>Suporte: (19) 9 9504-4272 • marcio_vasconcelos@hotmail.com.br</div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js?v=8"></script><script>let db,activeId='',participants=[];const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const norm=s=>String(s||'').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g,'');function dateOk(ts){const d=new Date(Number(ts||0));if(!Number.isFinite(d.getTime()))return false;const a=$('start').value,b=$('end').value,x=new Date(d.getFullYear(),d.getMonth(),d.getDate());return(!a||x>=new Date(a+'T00:00:00'))&&(!b||x<=new Date(b+'T23:59:59'))}function load(){if(activeId){loadRegistered();return}db.ref('orders').once('value').then(s=>{const v=s.val()||{},m=new Map();Object.values(v).forEach(o=>{if(!dateOk(o.createdAt))return;const c=o.customer||{},phone=String(c.phone||'').replace(/\D/g,'');if(!phone)return;if(!m.has(phone))m.set(phone,{name:c.name||'Cliente',phone,source:'pedido'});});participants=[...m.values()];$('count').textContent='Participantes válidos: '+participants.length;$('draw').disabled=!participants.length}).catch(()=>alert('Erro ao carregar participantes.'))}function create(){const data={name:$('name').value.trim()||'Sorteio Akatsuky',prize:$('prize').value.trim()||'Prêmio',start:$('start').value||'',end:$('end').value||'',question:$('question').value.trim(),answer:$('answer').value.trim(),requireCorrect:$('requireCorrect').checked,createdAt:firebase.database.ServerValue.TIMESTAMP};db.ref('raffles').push(data).then(r=>{activeId=r.key;const url=location.href.replace(/sorteios\.html.*$/,'sorteio-participar.html')+'?id='+encodeURIComponent(activeId);$('link').textContent=url;$('publicLink').classList.remove('hidden');loadRegistered();loadHistory();alert('Sorteio criado! Copie o link e coloque no Instagram.')}).catch(()=>alert('Erro ao criar sorteio.'))}function loadRegistered(){db.ref('raffles/'+activeId+'/participants').once('value').then(s=>{const all=Object.values(s.val()||{}),answer=norm($('answer').value),req=$('requireCorrect').checked;participants=all.filter(p=>!req||norm(p.answer)===answer);$('count').textContent='Participantes válidos: '+participants.length;$('draw').disabled=!participants.length})}function draw(){if(!participants.length||!activeId)return;const p=participants[Math.floor(Math.random()*participants.length)];db.ref('raffles/'+activeId).update({winner:p,winnerAt:firebase.database.ServerValue.TIMESTAMP}).then(()=>{$('winner').classList.remove('hidden');$('winner').innerHTML='🏆 GANHADOR<br><strong>'+esc(p.name)+'</strong><br><small>'+esc(p.phone)+'</small><br>📸 '+esc(p.instagram||'—')+'<br><br>🎁 '+esc($('prize').value.trim()||'Prêmio');loadHistory()})}function loadHistory(){db.ref('raffles').limitToLast(20).once('value').then(s=>{const a=Object.values(s.val()||{}).reverse();$('history').innerHTML=a.length?a.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #292e38"><b>${esc(x.name||'Sorteio')}</b> — ${esc(x.prize||'Prêmio')}<br>👥 ${Object.keys(x.participants||{}).length} participantes ${x.winner?`• 🏆 ${esc(x.winner.name||'')}`:''}</div>`).join(''):'Nenhum sorteio realizado.'})}firebase.initializeApp(window.AKATSUKY_FIREBASE_CONFIG);db=firebase.database();firebase.auth().onAuthStateChanged(u=>{if(!u){location.href='painel.html';return}loadHistory()});$('create').onclick=create;$('load').onclick=load;$('draw').onclick=draw;</script></body></html>
