<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Participar do Sorteio • Akatsuky</title><style>body{margin:0;background:#08090c;color:#fff;font-family:Arial,sans-serif}.wrap{max-width:560px;margin:auto;padding:24px}.card{background:#11141a;border:1px solid #292e38;border-radius:18px;padding:24px}.logo{text-align:center}.logo h1{margin-bottom:4px}.muted{color:#969daa}label{display:block;margin-top:14px;font-weight:700}input,button{width:100%;padding:13px;margin-top:6px;box-sizing:border-box;border-radius:10px;border:1px solid #343844;background:#0b0e13;color:#fff;font-size:16px}button{background:#df1733;border-color:#ff3048;font-weight:800;cursor:pointer;margin-top:18px}.success{display:none;text-align:center;color:#5ce2a2;font-size:21px}.error{color:#ff7b8a;margin-top:10px}.prize{font-size:20px;text-align:center;margin:14px 0}.support{text-align:center;color:#777;margin-top:20px;font-size:12px}</style></head><body><main class="wrap"><div class="card"><div class="logo"><h1>🍣 AKATSUKY</h1><p class="muted">🎉 <span id="raffleName">Sorteio</span></p></div><div id="form"><div class="prize">🎁 <b id="prize">Prêmio</b></div><p id="period" class="muted"></p><label>Nome completo<input id="name" autocomplete="name" maxlength="100"></label><label>WhatsApp / Telefone<input id="phone" autocomplete="tel" inputmode="tel" maxlength="30"></label><label>Instagram (@usuário)<input id="instagram" autocomplete="off" maxlength="60" placeholder="@seuinstagram"></label><div id="questionBox"><label>📝 <span id="question"></span><input id="answer" maxlength="300"></label></div><button id="submit">🎟️ PARTICIPAR DO SORTEIO</button><div id="error" class="error"></div></div><div id="success" class="success"><div style="font-size:54px">🎉</div><b>Inscrição realizada!</b><p class="muted">Boa sorte! Seu nome foi registrado para este sorteio.</p></div><div class="support">Desenvolvido por Marcio Vasconcelos<br>Suporte: (19) 9 9504-4272 • marcio_vasconcelos@hotmail.com.br</div></div></main><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script><script src="firebase-config.js?v=8"></script><script>const $=id=>document.getElementById(id);const norm=s=>String(s||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('pt-BR');const params=new URLSearchParams(location.search);const id=params.get('id');let db,raffle;if(!id){$('form').innerHTML='<p class="error">Link de sorteio inválido.</p>'}else{firebase.initializeApp(window.AKATSUKY_FIREBASE_CONFIG);db=firebase.database();db.ref('raffles/'+id).once('value').then(s=>{raffle=s.val();if(!raffle)throw Error('notfound');$('raffleName').textContent=raffle.name||'Sorteio Akatsuky';$('prize').textContent=raffle.prize||'Prêmio';$('question').textContent=raffle.question||'Por que você quer participar do sorteio?';if(!raffle.question)$('answer').value='';$('period').textContent=(raffle.start||raffle.end)?`Período: ${raffle.start||'início'} até ${raffle.end||'fim'}`:''}).catch(()=>{$('form').innerHTML='<p class="error">Sorteio não encontrado ou encerrado.</p>'})}function submit(){const name=$('name').value.trim(),phone=$('phone').value.trim(),instagram=$('instagram').value.trim(),answer=$('answer').value.trim();if(!name||!phone){$('error').textContent='Informe nome e telefone.';return}if(raffle?.question&&!answer){$('error').textContent='Responda à pergunta para participar.';return}$('submit').disabled=true;$('error').textContent='Enviando...';const phoneKey=phone.replace(/\D/g,'');const participant={name,phone,instagram,answer,createdAt:firebase.database.ServerValue.TIMESTAMP};db.ref('raffles/'+id+'/participants/'+phoneKey).set(participant).then(()=>{$('form').style.display='none';$('success').style.display='block'}).catch(e=>{$('error').textContent='Não foi possível registrar. Tente novamente.';$('submit').disabled=false})}$('submit').onclick=submit;</script></body></html>
