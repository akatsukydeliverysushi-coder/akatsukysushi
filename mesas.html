<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Akatsuky • Mesas</title><style>*{box-sizing:border-box}body{margin:0;background:#08090c;color:#f7f7fa;font-family:Arial,sans-serif}.top{padding:18px 24px;background:#11141a;border-bottom:1px solid #292d36;display:flex;justify-content:space-between;align-items:center}.wrap{max-width:1400px;margin:auto;padding:22px}.mesas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.mesa{background:#14171e;border:1px solid #303540;border-radius:15px;padding:18px}.livre{border-color:#246f4d}.ocupada{border-color:#8b2737}.mesa h2{margin:0 0 8px}.status{font-weight:800}.btn{border:0;border-radius:9px;padding:10px 13px;background:#e51b34;color:#fff;font-weight:800;cursor:pointer;margin:5px 5px 0 0}.btn:disabled{opacity:.5;cursor:wait}.pedidos{margin-top:28px;display:grid;gap:12px}.pedido{background:#14171e;border:1px solid #303540;border-radius:14px;padding:16px}.pedido .head{display:flex;justify-content:space-between}.badge{padding:6px 10px;border-radius:20px;background:#3a1219;color:#ff8090}.green{background:#0d1b15;color:#63e9ac}.blue{background:#0d1924;color:#63b8ff}.muted{color:#9ba1ae}.total{font-weight:900;font-size:18px}.erro{display:none;background:#4a151b;color:#fff;padding:12px;border-radius:10px;margin:15px 0}@media(max-width:600px){.top{padding:15px}.wrap{padding:12px}}</style></head><body><header class="top"><div><b>🍣 AKATSUKY DELIVERY SUSHI</b><div class="muted">🍽️ Painel de Mesas</div></div><a class="btn" href="painel.html">← Delivery</a></header><main class="wrap"><h1>🍽️ Mesas</h1><div id="erro" class="erro"></div><div id="mesas" class="mesas"></div><h2>🔔 Pedidos de mesa</h2><div id="pedidos" class="pedidos"></div></main><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js';import{getDatabase,ref,onValue,update}from'https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js';import{firebaseConfig}from'./firebase-config.js';const db=getDatabase(initializeApp(firebaseConfig));const N=20;let data={};const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const labels={aguardando:'🔴 AGUARDANDO',recebido:'🟢 RECEBIDO',preparando:'🟡 PREPARANDO','saiu para entrega':'🟣 SAIU PARA ENTREGA',entregue:'🔵 FINALIZADO'};const statusLabel=s=>labels[s]||s;function render(){const mesaMap={};Object.values(data).forEach(p=>{if(p&&p.mesa)mesaMap[String(p.mesa).padStart(2,'0')]=(mesaMap[String(p.mesa).padStart(2,'0')]||[]).concat(p)});document.getElementById('mesas').innerHTML=Array.from({length:N},(_,i)=>String(i+1).padStart(2,'0')).map(m=>{const ps=mesaMap[m]||[];const aberta=ps.some(p=>p.status!=='entregue');return `<div class="mesa ${aberta?'ocupada':'livre'}"><h2>🍽️ Mesa ${m}</h2><div class="status">${aberta?'🔴 OCUPADA':'🟢 LIVRE'}</div><div class="muted">${ps.length} pedido(s)</div><a class="btn" href="mesa.html?mesa=${m}">📱 Abrir pedido</a></div>`}).join('');const arr=Object.entries(data).filter(([_,p])=>p&&p.status!=='entregue').sort((a,b)=>(Number(b[1].criadoEm)||0)-(Number(a[1].criadoEm)||0));document.getElementById('pedidos').innerHTML=arr.length?arr.map(([id,p])=>`<article class="pedido"><div class="head"><b>🍽️ MESA ${p.mesa}</b><span class="badge ${p.status==='recebido'?'green':''} ${p.status==='entregue'?'blue':''}">${statusLabel(p.status)}</span></div><p>${(p.itens||[]).map(x=>`${x.qtd}x ${x.nome}`).join('<br>')}</p><div class="total">${brl(p.total)}</div><div>${p.status==='aguardando'?`<button class="btn action" data-id="${id}" data-status="recebido">✓ RECEBER</button>`:''}${p.status==='recebido'?`<button class="btn action" data-id="${id}" data-status="preparando">🍣 PREPARAR</button>`:''}${p.status==='preparando'?`<button class="btn action" data-id="${id}" data-status="entregue">✓ FINALIZAR</button>`:''}</div></article>`).join(''):'<div class="pedido muted">Nenhum pedido de mesa pendente.</div>';document.querySelectorAll('.action').forEach(btn=>btn.addEventListener('click',()=>setStatus(btn.dataset.id,btn.dataset.status,btn)))}async function setStatus(id,status,btn){btn.disabled=true;document.getElementById('erro').style.display='none';try{await update(ref(db,'pedidosMesa/'+id),{status,atualizadoEm:Date.now()})}catch(e){btn.disabled=false;const box=document.getElementById('erro');box.textContent='❌ Não foi possível atualizar o pedido. Verifique o login e as regras de acesso do Firebase.';box.style.display='block';console.error(e)}}onValue(ref(db,'pedidosMesa'),s=>{data=s.val()||{};render()},e=>{const box=document.getElementById('erro');box.textContent='❌ Erro ao carregar pedidos: '+e.message;box.style.display='block'});</script></body></html>
